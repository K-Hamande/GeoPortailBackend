server:
  port: 8080
  error:
    # Sans ceci, Spring Boot masque le champ "message" des reponses
    # d'erreur JSON par defaut (uniquement active en dev jusqu'ici, cf.
    # application-dev.yml) - les messages precis renvoyes par le backend
    # (ex: "Un compte avec ce login existe déjà.") n'atteignaient donc
    # jamais l'utilisateur en production, qui ne voyait qu'un message
    # generique. include-stacktrace reste volontairement dev-only
    # (§4.4 du CDC : pas de detail d'implementation expose au client).
    include-message: always
  tomcat:
    # §4.4 du CDC : journalisation des acces HTTP, conservee 90 jours
    # minimum. Le valve d'acces de Tomcat (embarque) ecrit un fichier par
    # jour et purge automatiquement, a chaque rotation, les fichiers plus
    # vieux que max-days - pas de dependance ni de filtre applicatif
    # supplementaire necessaire.
    accesslog:
      enabled: true
      directory: logs/access
      prefix: access_log
      suffix: .log
      pattern: '%h %l %u %t "%r" %s %b %D'
      rotate: true
      max-days: 90

spring:
  application:
    name: geoportail-resina-backend
  profiles:
    active: dev
  flyway:
    enabled: true
    schemas: geoportail_resina
    default-schema: geoportail_resina
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${RESINA_ALERT_SMTP_HOST:smtp.gmail.com}
    port: ${RESINA_ALERT_SMTP_PORT:587}
    username: ${RESINA_ALERT_SMTP_USERNAME:}
    password: ${RESINA_ALERT_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

resina:
  message: "Configuration de base (aucun profil specifique)"
  netxms-sync:
    enabled: true
    sites-cron: "0 0 2 * * *"
    equipments-cron: "0 15 2 * * *"
  # Alerte email "version 1" : un seul destinataire, prevenu pour
  # n'importe quel site des qu'un incident (ANPTIC ou LAN) apparait.
  # RESINA_ALERT_EMAIL et les identifiants SMTP (RESINA_ALERT_SMTP_*)
  # sont a definir en variables d'environnement - laisses vides ici,
  # l'envoi est simplement ignore (avec un log) tant qu'ils ne le sont pas.
  alertes:
    enabled: true
    check-cron: "0 */5 * * * *"
    email-destinataire: ${RESINA_ALERT_EMAIL:}